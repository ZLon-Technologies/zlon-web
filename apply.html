<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZLon | Partner Application</title>
    <link rel="shortcut icon" href="favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "url": "https://zlon.in",
      "logo": "https://zlon.in/favicon.png"
    }
    </script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        if (window.emailjs) {
            emailjs.init("HOTmsXLD5WPCyFKh0");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="pwa.js"></script>
    <style>
        :root { --brand: #000; --bg: #fff; --muted: #666; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); color: #000; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 25px 5%; border-bottom: 1px solid #eee; }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; }
        .back-btn { text-decoration: none; color: var(--muted); font-size: 14px; }

        .container { max-width: 600px; margin: 60px auto; padding: 0 20px; }
        .badge { display: inline-block; padding: 6px 15px; border-radius: 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; }
        .badge-standard { background: #f0f0f0; color: #555; }
        .badge-premium { background: #000; color: #fff; }

        h1 { font-size: 36px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px; }
        p.subtitle { color: var(--muted); margin-bottom: 50px; font-size: 16px; }

        form { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .full-width { grid-column: span 2; }
        
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 10px; color: #333; }
        input, select, textarea { 
            width: 100%; padding: 15px; border: 1px solid #eee; border-radius: 12px; 
            font-size: 16px; box-sizing: border-box; background: #fafafa; transition: all 0.2s;
        }
        input:focus { outline: none; border-color: #000; background: #fff; }

        .ppp-section { 
            display: none; background: #fdfdfd; padding: 30px; border-radius: 16px; 
            border: 1px solid #eee; margin-top: 10px; 
        }

        .submit-btn { 
            grid-column: span 2; padding: 20px; background: #000; color: #fff; 
            border: none; border-radius: 12px; font-size: 18px; font-weight: 700; 
            cursor: pointer; margin-top: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .submit-btn:hover { background: #222; transform: translateY(-2px); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ZLon<span>.</span></div>
        <a href="business.html" class="back-btn">← Back to Business</a>
    </nav>

    <div class="container">
        <div id="planBadge" class="badge">Validating...</div>
        <h1 id="formTitle">Partner Application</h1>
        <p class="subtitle">Join our network of forward-thinking salons. Review time: 48 hours.</p>

        <form id="partnerForm">
            <div class="full-width">
                <label>Salon / Shop Name</label>
                <input type="text" id="salon_name" placeholder="Business name" required>
            </div>
            
            <div>
                <label>Owner Name</label>
                <input type="text" id="owner_name" required>
            </div>
            <div>
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div>
                <label>WhatsApp Number</label>
                <input type="tel" id="phone" placeholder="+91" required>
            </div>
            <div>
                <label>Years in Business</label>
                <input type="number" id="biz_age" placeholder="0" required>
            </div>

            <div class="full-width">
                <label>Full Address</label>
                <textarea id="address" rows="3" required></textarea>
            </div>

            <div>
                <label>Salon Capacity</label>
                <select id="chairs">
                    <option value="1-3">1 - 3 Chairs</option>
                    <option value="4-7">4 - 7 Chairs</option>
                    <option value="8+">8+ Premium Stations</option>
                </select>
            </div>

            <div>
                <label>Approx. Monthly Revenue</label>
                <select id="revenue">
                    <option value="below_50k">Below ₹50,000</option>
                    <option value="50k_2l">₹50,000 - ₹2 Lakhs</option>
                    <option value="above_2l">Above ₹2 Lakhs</option>
                </select>
            </div>

            <div id="premiumExtras" class="full-width ppp-section">
                <h3 style="margin-top:0; font-size: 18px; margin-bottom: 20px;">Premium Verification Details</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="full-width">
                        <label>Existing Website (If any)</label>
                        <input type="url" id="website" placeholder="https://...">
                    </div>
                    <div class="full-width">
                        <label>GST Number</label>
                        <input type="text" id="gst" placeholder="For official verification">
                    </div>
                    <div class="full-width">
                        <label>Vision for Partnership</label>
                        <textarea id="ppp_reason" rows="2" placeholder="Tell us why you want the Premium badge..."></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Send Application</button>
        </form>
    </div>

    <script>
        // Detection Logic
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan') || 'standard';
        const badge = document.getElementById('planBadge');
        const premiumSection = document.getElementById('premiumExtras');

        if (plan === 'premium') {
            badge.innerText = "Premium Partner Program";
            badge.className = "badge badge-premium";
            premiumSection.style.display = "block";
        } else {
            badge.innerText = "Standard Platform";
            badge.className = "badge badge-standard";
        }

        // Supabase Logic
        let db = null;
        try {
            db = window.ZLon.getSupabaseClient();
        } catch (error) {
            console.warn(error.message);
        }

        async function sendLeadNotification() {
            if (!window.emailjs) {
                console.error('Email notification failed...', 'EmailJS SDK unavailable');
                return;
            }

            try {
                const response = await emailjs.send("service_48tenxq", "template_paduv0j", {
                    owner_name: document.getElementById('owner_name').value,
                    shop_name: document.getElementById('salon_name').value,
                    phone: document.getElementById('phone').value
                });
                console.log('Lead notification sent!', response.status, response.text);
            } catch (error) {
                console.error('Email notification failed...', error);
            }
        }

        document.getElementById('partnerForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            if (!db) {
                alert("Supabase is not configured yet.");
                btn.innerText = "Send Application";
                btn.disabled = false;
                return;
            }
            
            const submission = {
                plan_type: plan,
                salon_name: document.getElementById('salon_name').value,
                owner_name: document.getElementById('owner_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                biz_age: parseInt(document.getElementById('biz_age').value),
                address: document.getElementById('address').value,
                chairs: document.getElementById('chairs').value,
                revenue: document.getElementById('revenue').value,
                website: document.getElementById('website') ? document.getElementById('website').value : null,
                gst: document.getElementById('gst') ? document.getElementById('gst').value : null,
                ppp_reason: document.getElementById('ppp_reason') ? document.getElementById('ppp_reason').value : null
            };

            const { error } = await db.from('applications').insert([submission]);

            if (error) {
                alert("Submission failed: " + error.message);
                btn.innerText = "Send Application";
                btn.disabled = false;
            } else {
                await sendLeadNotification();
                alert("Success! Your application has been submitted to ZLon.");
                window.location.href = "index.html";
            }
        };
    </script>
</body>
</html>
