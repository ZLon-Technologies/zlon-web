<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZLon | Barber Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #111; }
        .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .customer-name { font-size: 18px; font-weight: bold; }
        .next-btn { background-color: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .next-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Live Queue</h1>
        <p style="color: #666; margin-bottom: 20px;">Currently waiting: <span id="queue-count">0</span> people</p>
        
        <div id="queue-list">
            <p>Loading the queue...</p>
        </div>
    </div>

    <script>
    // 1. Your actual ZLon Database connection
    const SUPABASE_URL = 'https://eplbnqgncxarpotwilai.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwbGJucWduY3hhcnBvdHdpbGFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MzYzNzEsImV4cCI6MjA5MDExMjM3MX0.CFxHAJo-GhhL-3x2aZeukmeMzL8pKjnoPA8fdFUIzYg';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchQueue() {
        console.log("Fetching live queue data...");
        
        let { data: queue, error } = await db
            .from('queue') 
            .select('*')
            .eq('status', 'waiting')
            .order('created_at', { ascending: true });

        if (error) {
            console.error("Supabase Error:", error.message);
            document.getElementById('queue-list').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            return;
        }

        const queueList = document.getElementById('queue-list');
        document.getElementById('queue-count').innerText = queue.length;
        
        if (queue.length === 0) {
            queueList.innerHTML = '<p style="text-align:center; color:#999;">The queue is currently empty.</p>';
            return;
        }

        queueList.innerHTML = ''; 

        queue.forEach(person => {
            queueList.innerHTML += `
                <div class="queue-item" id="customer-${person.id}">
                    <div class="customer-name">${person.name} <br><span style="font-size:12px; font-weight:normal; color:#666;">${person.phone}</span></div>
                    <button class="next-btn" onclick="serveCustomer(${person.id})">Serve Next</button>
                </div>
            `;
        });
    }

    async function serveCustomer(customerId) {
        const { error } = await db
            .from('queue')
            .update({ status: 'served' })
            .eq('id', customerId);

        if (error) {
            console.error("Update Error:", error.message);
            return;
        }
        fetchQueue();
    }

    // REAL-TIME: This makes the names pop up without refreshing!
    db.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, () => {
          fetchQueue();
      })
      .subscribe();

    fetchQueue();
</script>
</body>
</html>
